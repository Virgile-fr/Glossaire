<style>
  :root {color-scheme:light;--bg:#f8f8f6;--white:#fff;--text:#161b1a;--muted:#5e6764;--soft:#858c88;--line:#e3e7e3;--line-strong:#cfd6d1;--ink:#315c49;--shadow:0 6px 20px rgba(27,40,30,.025)}

  html {scroll-behavior:smooth}

  .search input {width:100%;border:1px solid var(--line-strong);background:white;border-radius:8px;height:47px;padding:0 16px 0 43px;color:var(--text)}
  .search input::placeholder {color:#919a94}
  .switch {display:flex;border:1px solid var(--line-strong);background:white;border-radius:8px;padding:4px;flex:none}
  .switch button {border:0;background:transparent;color:var(--muted);border-radius:5px;font-size:12px;font-weight:700;padding:8px 12px;line-height:1.2}
  .switch button[aria-pressed=true] {background:var(--text);color:white}
  .filters {display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding-top:14px;padding-bottom:3px}
  .filter {border:1px solid var(--line-strong);background:transparent;color:#47504b;border-radius:100px;padding:6px 12px;font-size:12px;white-space:nowrap;line-height:1.5}
  .filter[aria-pressed=true] {background:#e1e9e3;color:#224e36;border-color:#ceded2;font-weight:650}
  .filter:hover {border-color:#7e9888}
  main {padding:18px 0 70px}

  .group h2 {font-size:23px;letter-spacing:-.036em;line-height:1.25;font-weight:675}
  .group-count {font-size:12px;color:var(--soft);white-space:nowrap}
  .term {display:grid;grid-template-columns:minmax(185px, .95fr) minmax(205px, 1.15fr) minmax(230px, 1.3fr);gap:28px;padding:22px 3px;border-bottom:1px solid var(--line);align-items:start}
  .term-title {font-size:15px;font-weight:705;letter-spacing:-.012em;line-height:1.35}
  .term-fr {font-size:13px;color:var(--muted);margin-top:5px}
  .definition {font-size:13px;line-height:1.6;color:#3b4640}
  .example {font-size:12.5px;line-height:1.55;color:#57625a;display:flex;align-items:start;gap:9px}
  .example-text {flex:1;min-width:0}
  .copy {border:1px solid transparent;background:transparent;color:#87928a;border-radius:5px;padding:4px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:-4px}
  .copy:hover {color:#244b38;background:#ebf0eb;border-color:var(--line)}
  .copy svg {width:15px;height:15px}
  .labels {display:grid;grid-template-columns:minmax(185px, .95fr) minmax(205px, 1.15fr) minmax(230px, 1.3fr);gap:28px;padding:13px 3px 4px;color:var(--soft);font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .empty {padding:75px 0;text-align:center;color:var(--muted)}
  footer {border-top:1px solid var(--line);color:var(--soft);font-size:12px;padding:22px 0 28px}
  .toast {position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:.2s ease;background:#202724;color:#fff;border-radius:7px;padding:9px 14px;font-size:12px;z-index:40}
  .toast.visible {opacity:1;transform:translate(-50%,0)}
  mark {background:#e7efd1;color:inherit;border-radius:2px}
  @media(max-width:850px) {.term{grid-template-columns:minmax(145px,1fr) 2fr;gap:9px 20px}.term .example {grid-column:2}.labels{display:none}.group{padding-top:29px}.top{padding:32px 0 23px}}
  @media(max-width:540px) {.wrap{padding:0 17px}.title-row{display:block}.meta{margin-top:12px}.tools{padding:14px 0 11px}.search input{height:43px;font-size:14px}.term{display:block;padding:18px 1px}.definition{margin-top:8px}.example{margin-top:9px}.group h2{font-size:20px}.group{scroll-margin-top:150px}.switch button{padding:8px 9px}.tools-top{gap:9px}main{padding:4px 0 50px}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast{transition:none}}
</style>

<script>
'use strict';
const groups=[{"id":"cadrage","name":"Plans & angles de vue","terms":[["Wide shot","Plan large","Montre le sujet dans son environnement et donne de l’importance au décor.","wide shot of a lone cyclist on a coastal road","plan large d’un cycliste seul sur une route côtière"],["Full shot","Plan en pied","Cadre un personnage de la tête aux pieds, sans couper sa silhouette.","full shot of a dancer in a studio","plan en pied d’une danseuse en studio"],["Medium shot","Plan moyen","Présente le sujet à une distance intermédiaire, assez proche pour lire son attitude.","medium shot of a chef at work","plan moyen d’un chef au travail"],["Medium close-up","Plan rapproché poitrine","Cadrage d’un personnage, généralement de la poitrine au-dessus de la tête.","medium close-up of a person looking out a window","plan rapproché poitrine d’une personne à la fenêtre"],["Close-up","Gros plan","Isole un visage, un objet ou un détail significatif.","close-up of a watch dial","gros plan sur un cadran de montre"],["Extreme close-up","Très gros plan","Montre une fraction réduite d’un sujet : œil, texture ou pièce d’un objet.","extreme close-up of a human eye","très gros plan sur un œil"],["Macro shot","Plan macro","Très gros plan sur un petit sujet, révélant ses détails de surface.","macro shot of a leaf with water droplets","plan macro d’une feuille couverte de gouttes d’eau"],["Top-down view","Vue du dessus à 90°","Caméra placée directement au-dessus du sujet, axe perpendiculaire à la surface.","top-down view of a breakfast tray","vue du dessus à 90° d’un plateau de petit-déjeuner"],["Bird's-eye view","Vue aérienne oblique","Prise de vue depuis un point élevé, généralement orientée vers le bas sans être nécessairement verticale.","bird’s-eye view of an intersection","vue aérienne oblique d’un carrefour"],["High angle","Plongée","Caméra orientée vers le bas, au-dessus du sujet.","high-angle shot of a person on a staircase","plongée sur une personne dans un escalier"],["Low angle","Contre-plongée","Caméra placée sous le sujet et orientée vers le haut.","low-angle shot of a concrete tower","contre-plongée sur une tour en béton"],["Eye-level shot","À hauteur des yeux","Position neutre, proche du regard habituel d’une personne.","eye-level portrait in natural light","portrait à hauteur des yeux en lumière naturelle"],["Over-the-shoulder shot","Plan par-dessus l’épaule","Cadre une scène derrière l’épaule d’un personnage au premier plan.","over-the-shoulder view of an illustrator at a desk","vue par-dessus l’épaule d’une illustratrice à son bureau"],["First-person POV","Vue subjective","Montre une scène comme si l’on regardait à travers les yeux du personnage.","first-person POV looking down at an open sketchbook","vue subjective sur un carnet de croquis ouvert"],["Three-quarter view","Vue de trois quarts","Montre plusieurs faces d’un objet ou du visage pour mieux lire le volume.","three-quarter view of a ceramic vase","vue de trois quarts d’un vase en céramique"],["Flat lay","Composition à plat","Objets disposés sur une surface, photographiés du dessus.","minimal flat lay of paper samples","composition à plat minimaliste d’échantillons de papier"],["Dutch angle","Plan incliné","Caméra volontairement tournée autour de son axe pour créer un horizon oblique.","dutch-angle shot of a hallway","plan incliné d’un couloir"]]},{"id":"optique","name":"Objectifs & profondeur","terms":[["24mm wide-angle lens","Grand-angle 24 mm","Champ de vision large, perspective accentuée à courte distance.","interior photograph with a 24mm wide-angle lens","photographie d’intérieur au grand-angle 24 mm"],["35mm lens","Objectif 35 mm","Perspective souvent utilisée en reportage et photographie de rue.","35mm street photography, natural perspective","photographie de rue au 35 mm, perspective naturelle"],["50mm lens","Objectif 50 mm","Champ de vision modéré, utile pour une représentation équilibrée.","50mm lens portrait in a studio","portrait en studio au 50 mm"],["85mm portrait lens","Objectif portrait 85 mm","Angle de vue plus resserré, souvent utilisé pour isoler un portrait.","headshot with an 85mm portrait lens","portrait serré avec un objectif 85 mm"],["Telephoto compression","Compression des plans","Effet visuel de rapprochement apparent entre les plans avec une longue focale.","telephoto compression of distant mountain layers","compression des plans de montagnes éloignées"],["Shallow depth of field","Faible profondeur de champ","Sujet net, arrière-plan progressivement flou.","shallow depth of field on a flower","faible profondeur de champ sur une fleur"],["Deep focus","Grande profondeur de champ","Plusieurs plans, de l’avant à l’arrière, restent suffisamment nets.","deep focus landscape with a sharp foreground","paysage avec une grande profondeur de champ"],["Bokeh","Bokeh","Aspect visuel des zones hors foyer, notamment des points lumineux flous.","soft bokeh lights behind the portrait","bokeh doux derrière le portrait"],["Tilt-shift effect","Effet tilt-shift","Effet de bascule et de décentrement de l’optique ; peut créer un plan de netteté incliné ou corriger des perspectives.","tilt-shift miniature effect of a busy street","effet miniature tilt-shift sur une rue animée"]]},{"id":"lumiere","name":"Lumière & ombres","terms":[["Soft diffused light","Lumière douce et diffuse","Éclairage enveloppant, avec des transitions d’ombre progressives.","soft diffused light on a glass bottle","lumière douce et diffuse sur une bouteille en verre"],["Hard directional light","Lumière dure et directionnelle","Éclairage net générant des ombres marquées.","hard directional light casting sharp shadows","lumière dure directionnelle avec ombres tranchées"],["Side lighting","Éclairage latéral","Lumière venant du côté pour révéler volumes et textures.","side lighting on a textured plaster wall","éclairage latéral sur un mur en plâtre texturé"],["Backlighting","Contre-jour","Source de lumière placée derrière le sujet.","backlit silhouette in a doorway","silhouette à contre-jour dans une porte"],["Rim light","Liseré lumineux","Lumière venant de l’arrière qui souligne les contours du sujet.","subtle rim light around a dark sculpture","fin liseré lumineux autour d’une sculpture sombre"],["Golden hour","Heure dorée","Lumière chaude et basse, souvent en fin ou début de journée.","golden-hour sunlight on a seaside building","lumière de l’heure dorée sur un bâtiment côtier"],["Blue hour","Heure bleue","Lumière froide et douce au crépuscule, avant ou après le soleil.","blue-hour cityscape with illuminated windows","paysage urbain à l’heure bleue, fenêtres allumées"],["Overcast daylight","Lumière de ciel couvert","Lumière naturelle diffuse avec de faibles ombres.","overcast daylight portrait outdoors","portrait extérieur sous un ciel couvert"],["Studio softbox","Boîte à lumière","Source de studio douce et contrôlable, souvent rectangulaire.","product lighting with a large studio softbox","éclairage produit avec une grande boîte à lumière"],["Chiaroscuro","Clair-obscur","Contraste affirmé entre les zones éclairées et les parties sombres.","chiaroscuro portrait on a dark background","portrait en clair-obscur sur fond sombre"],["Volumetric light","Lumière volumétrique","Rayons visibles dans la brume ou la poussière en suspension.","volumetric light rays through a dusty window","rayons de lumière volumétrique à travers une fenêtre poussiéreuse"],["Practical lighting","Éclairage intégré au décor","Éclairage produit par des sources visibles dans la scène : lampes, néons, bougies.","portrait lit by practical table lamps","portrait éclairé par des lampes présentes dans le décor"],["High-key lighting","Éclairage high-key","Image très lumineuse, avec peu d’ombres marquées et un contraste modéré.","high-key studio portrait on a light background","portrait de studio high-key sur fond clair"],["Low-key lighting","Éclairage low-key","Image dominée par des tons sombres, avec des zones de lumière localisées.","low-key portrait with a single side light","portrait low-key éclairé par une source latérale"],["Rembrandt lighting","Éclairage Rembrandt","Éclairage de portrait qui crée un petit triangle lumineux sur la joue opposée à la source.","Rembrandt lighting on a seated portrait","éclairage Rembrandt sur un portrait assis"],["Specular highlights","Reflets spéculaires","Reflets lumineux concentrés sur les surfaces lisses, brillantes ou humides.","specular highlights on polished steel","reflets spéculaires sur de l’acier poli"]]},{"id":"composition","name":"Composition","terms":[["Rule of thirds","Règle des tiers","Placement des éléments importants autour des tiers du cadre.","subject positioned on the right third","sujet positionné sur le tiers droit"],["Centered composition","Composition centrée","Sujet placé au centre, souvent pour une lecture stable.","centered composition of a single chair","composition centrée autour d’une seule chaise"],["Negative space","Espace négatif","Zone volontairement peu occupée pour créer du contraste ou recevoir du texte.","generous negative space above the product","grand espace négatif au-dessus du produit"],["Symmetrical composition","Composition symétrique","Répartition en miroir autour d’un axe.","symmetrical composition in a modern hallway","composition symétrique dans un couloir contemporain"],["Leading lines","Lignes directrices","Lignes du décor qui conduisent le regard vers un point.","leading lines toward the entrance","lignes directrices vers l’entrée"],["Foreground framing","Cadrage par le premier plan","Éléments proches de l’objectif encadrant ou renforçant la profondeur.","foreground leaves framing the subject","feuilles au premier plan qui encadrent le sujet"],["Layered depth","Plans successifs","Superposition de premier plan, plan moyen et arrière-plan.","layered depth with foreground shadows","plans successifs avec ombres au premier plan"],["Frame within a frame","Cadre dans le cadre","Utilisation d’une porte, fenêtre ou structure pour encadrer un sujet.","portrait framed by a doorway","portrait encadré par une porte"],["Visual hierarchy","Hiérarchie visuelle","Organisation des éléments selon leur importance perceptive.","clear visual hierarchy in an editorial composition","hiérarchie visuelle nette dans une composition éditoriale"],["Subject isolation","Sujet isolé","Sujet détaché du fond par l’espace, le contraste ou la profondeur de champ.","isolated object against a seamless background","objet isolé devant un fond continu"]]},{"id":"couleurs","name":"Couleurs & contrastes","terms":[["Muted color palette","Palette sourde","Couleurs atténuées, peu saturées.","muted color palette with sage green and clay","palette sourde vert sauge et terre cuite"],["Monochromatic palette","Palette monochrome","Variations de valeur et de saturation d’une même teinte.","monochromatic blue palette","palette monochrome bleue"],["Complementary colors","Couleurs complémentaires","Couleurs opposées sur le cercle chromatique, créant un contraste de teinte.","complementary orange and blue accents","accents orange et bleus complémentaires"],["Warm-cool contrast","Contraste chaud-froid","Opposition entre des tonalités chaudes et froides.","warm-cool contrast in a night interior","contraste chaud-froid dans un intérieur de nuit"],["Desaturated colors","Couleurs désaturées","Teintes dont l’intensité colorée est réduite.","desaturated colors with natural skin tones","couleurs désaturées et carnations naturelles"],["Pastel tones","Tons pastel","Couleurs claires, généralement peu saturées.","pastel tones on a paper sculpture","tons pastel sur une sculpture en papier"],["High contrast","Contraste élevé","Écart visuel marqué entre les zones claires et sombres.","high-contrast black-and-white portrait","portrait noir et blanc très contrasté"],["Low contrast","Contraste doux","Écarts limités entre les valeurs lumineuses.","low-contrast foggy landscape","paysage brumeux au contraste doux"],["Color grading","Étalonnage colorimétrique","Harmonisation ou stylisation globale des couleurs et valeurs d’une image.","subtle cinematic color grading","étalonnage cinéma discret"]]},{"id":"matieres","name":"Matières & textures","terms":[["Brushed aluminum","Aluminium brossé","Métal satiné avec de fines stries orientées.","brushed aluminum casing with fine grain","boîtier en aluminium brossé à grain fin"],["Polished chrome","Chrome poli","Métal très réfléchissant aux reflets nets.","polished chrome object reflecting studio lights","objet en chrome poli reflétant les lumières du studio"],["Matte ceramic","Céramique mate","Surface peu réfléchissante, souvent douce visuellement.","matte ceramic vase with subtle imperfections","vase en céramique mate aux légères irrégularités"],["Frosted glass","Verre dépoli","Verre translucide qui diffuse la lumière et floute ce qui se trouve derrière.","frosted glass partition in soft daylight","cloison en verre dépoli en lumière douce"],["Translucent resin","Résine translucide","Matière laissant passer la lumière sans être entièrement transparente.","translucent amber resin sculpture","sculpture en résine ambrée translucide"],["High-gloss finish","Finition brillante","Surface à reflets marqués, d’aspect lisse ou verni.","high-gloss black lacquer surface","surface laquée noire très brillante"],["Rough paper texture","Papier rugueux","Grain visible et irrégulier, utile pour un aspect imprimé ou artisanal.","rough paper texture on a poster","texture de papier rugueux sur une affiche"],["Woven fabric","Tissu tissé","Trame de fils perceptible, qui donne du relief à la surface.","visible woven fabric texture in natural light","trame de tissu tissé visible en lumière naturelle"],["Patina","Patine","Marques du temps, de l’oxydation ou de l’usage sur une matière.","weathered copper with a green patina","cuivre vieilli à patine verte"],["Embossed lettering","Lettrage en relief","Lettres légèrement surélevées ou creusées dans une surface.","embossed lettering on thick cotton paper","lettrage en relief sur papier coton épais"]]},{"id":"styles","name":"Techniques & médiums","terms":[["Documentary photography","Photographie documentaire","Approche qui privilégie une scène crédible et peu mise en scène.","documentary photograph of a morning market","photographie documentaire d’un marché matinal"],["Commercial product photography","Photographie publicitaire de produit","Image construite pour mettre en valeur un objet et sa matière.","commercial product photography of headphones","photographie publicitaire d’un casque audio"],["Editorial fashion photography","Photographie de mode éditoriale","Image de mode pensée comme une proposition de narration ou de direction artistique.","editorial fashion photography in an empty museum","photographie de mode éditoriale dans un musée vide"],["Cinematic still","Photogramme de cinéma","Composition et éclairage évoquant une image fixe extraite d’un film.","cinematic still in a dimly lit kitchen","photogramme de cinéma dans une cuisine faiblement éclairée"],["Minimalist graphic design","Design graphique minimaliste","Peu d’éléments, fortes décisions de composition et hiérarchie nette.","minimalist graphic design with bold typography","design graphique minimaliste à typographie affirmée"],["Cut-paper collage","Collage de papiers découpés","Superposition d’éléments papier aux bords et ombres visibles.","cut-paper collage of abstract plants","collage de papiers découpés représentant des plantes abstraites"],["Screen print","Sérigraphie","Esthétique d’impression à aplats, couches de couleurs et légers décalages possibles.","two-color screen print poster","affiche en sérigraphie à deux couleurs"],["Risograph print","Impression risographique","Rendu évoquant une impression à trames, encres limitées et repérage imparfait.","risograph print with visible halftone texture","impression risographique à trame apparente"],["3D render","Rendu 3D","Image synthétique produite par un éclairage et des matériaux numériques.","photorealistic 3D render of a modular lamp","rendu 3D photoréaliste d’une lampe modulaire"],["Isometric illustration","Illustration isométrique","Représentation axonométrique avec des axes de même réduction et sans point de fuite.","isometric illustration of a small workshop","illustration isométrique d’un petit atelier"]]},{"id":"graphisme","name":"Mise en page","terms":[["Typographic hierarchy","Hiérarchie typographique","Différenciation nette entre titre, sous-titre et informations secondaires.","strong typographic hierarchy on an exhibition poster","hiérarchie typographique marquée sur une affiche d’exposition"],["Grid-based layout","Mise en page sur grille","Disposition alignée sur des axes et modules réguliers.","grid-based editorial layout with wide margins","mise en page éditoriale sur grille à marges larges"],["Generous margins","Marges généreuses","Espace autour du contenu pour améliorer le rythme et la lisibilité.","generous margins around the main headline","marges généreuses autour du titre principal"],["Poster composition","Composition d’affiche","Organisation de l’image autour d’une zone principale et d’espaces destinés au texte.","poster composition with large image and free title area","composition d’affiche avec image principale et espace réservé au titre"]]},{"id":"ambiance","name":"Atmosphère & mouvement","terms":[["Hazy atmosphere","Atmosphère voilée","Légère brume qui réduit les contrastes et adoucit les contours.","hazy atmosphere in a sunlit room","atmosphère voilée dans une pièce ensoleillée"],["Atmospheric perspective","Perspective atmosphérique","Plans lointains moins contrastés et souvent plus froids.","atmospheric perspective over distant hills","perspective atmosphérique sur des collines lointaines"],["Candid moment","Instantané","Scène saisie avec une apparence spontanée, sans pose manifeste.","candid street photograph of two friends laughing","instantané de rue de deux amis qui rient"],["Motion blur","Flou de mouvement","Traînée produite par le déplacement du sujet ou de la caméra pendant l’exposition.","motion blur of cyclists crossing a street","flou de mouvement de cyclistes traversant une rue"],["Long exposure","Pose longue","Temps d’exposition prolongé qui rend visibles les déplacements de lumière ou l’écoulement de l’eau.","long exposure of traffic at night","pose longue de circulation nocturne"],["Film grain","Grain argentique","Texture aléatoire du film photographique, souvent reproduite dans les rendus numériques.","fine film grain on a black and white portrait","grain argentique fin sur un portrait noir et blanc"]]}];
const total=groups.reduce((sum,g)=>sum+g.terms.length,0);
let filter='all', query='', language='en';
const $=selector=>document.querySelector(selector);
const escapeHtml = value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const normalize=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const plural=(n)=>n>1?'termes':'terme';
const search=$('#search'),filters=$('#filters'),results=$('#results'),meta=$('#meta');
function renderFilters(){filters.innerHTML='<button class="filter" type="button" data-filter="all" aria-pressed="'+(filter==='all')+'">Tout</button>'+groups.map(g=>'<button class="filter" type="button" data-filter="'+g.id+'" aria-pressed="'+(filter===g.id)+'">'+escapeHtml(g.name)+'</button>').join('')}
function render(){let shown=0,sections='';
 for(const g of groups){if(filter!=='all'&&filter!==g.id)continue;
  const matches=g.terms.map((term,i)=>({term,i})).filter(({term})=>!query||normalize([...term,g.name].join(' ')).includes(normalize(query)));
  if(!matches.length)continue;shown+=matches.length;
  sections+='<section class="group" id="'+g.id+'"><div class="group-head"><h2>'+escapeHtml(g.name)+'</h2><span class="group-count">'+matches.length+' '+plural(matches.length)+'</span></div><div class="labels" aria-hidden="true"><span>Terme · EN / FR</span><span>Définition</span><span>Exemple de formulation · '+language.toUpperCase()+'</span></div>'+matches.map(({term,i})=>{
   const ex=term[language==='en'?3:4];return '<article class="term"><div><h3 class="term-title">'+escapeHtml(term[0])+'</h3><div class="term-fr">'+escapeHtml(term[1])+'</div></div><p class="definition">'+escapeHtml(term[2])+'</p><div class="example"><span class="example-text">'+escapeHtml(ex)+'</span><button class="copy" type="button" data-copy="'+g.id+':'+i+'" aria-label="Copier l’exemple : '+escapeHtml(term[0])+'" title="Copier l’exemple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div></article>'}).join('')+'</section>';
 }
 results.innerHTML=sections||'<div class="empty">Aucun terme trouvé.</div>';
 const categoryCount=filter==='all'?groups.filter(g=>g.terms.some(t=>!query||normalize([...t,g.name].join(' ')).includes(normalize(query)))).length:(shown?1:0);
 meta.textContent=shown+' '+plural(shown)+' · '+categoryCount+' '+(categoryCount===1?'catégorie':'catégories');
 }
filters.addEventListener('click',e=>{const btn=e.target.closest('[data-filter]');if(!btn)return;filter=btn.dataset.filter;renderFilters();render();});
search.addEventListener('input',e=>{query=e.target.value.trim();render()});
for(const id of ['en','fr'])$('#'+id).addEventListener('click',()=>{language=id;$('#en').setAttribute('aria-pressed',String(id==='en'));$('#fr').setAttribute('aria-pressed',String(id==='fr'));render()});
results.addEventListener('click',async e=>{const button=e.target.closest('[data-copy]');if(!button)return;const [id,i]=button.dataset.copy.split(':');const term=groups.find(g=>g.id===id)?.terms[Number(i)];if(!term)return;const value=term[language==='en'?3:4];
 try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.left='-9999px';document.body.appendChild(field);field.select();document.execCommand('copy');field.remove()}const toast=$('#toast');toast.classList.add('visible');clearTimeout(window._toast);window._toast=setTimeout(()=>toast.classList.remove('visible'),1450)}catch(err){window.prompt('Copier l’exemple :',value)}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}});
renderFilters();render();
</script>
</body>
